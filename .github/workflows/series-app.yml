name: Сериалы

on:
  schedule:
    - cron: '*/15 * * * *' # Каждые 15 минут; GitHub Actions может запускаться с задержкой
  workflow_dispatch:
    inputs:
      test_push:
        description: 'Отправить тестовое уведомление'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'series-app/site/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'schedule'
    concurrency:
      group: series-app-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Загрузить постеры
        continue-on-error: true
        working-directory: series-app/scripts
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          KINOPOISK_TOKEN: ${{ secrets.KINOPOISK_TOKEN }}
        run: node fetch-posters.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: series-app/site
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.modified, 'series-app/site/data/series.json') || contains(github.event.head_commit.modified, 'series-app/site/data/movies.json') || contains(github.event.head_commit.added, 'series-app/site/data/series.json') || contains(github.event.head_commit.added, 'series-app/site/data/movies.json')))
    concurrency:
      group: series-app-notify
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Обновить данные перед проверкой
        run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить зависимости
        working-directory: series-app/scripts
        run: npm ci
      - name: Отправить уведомления
        working-directory: series-app/scripts
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node notify.mjs ${{ github.event.inputs.test_push == 'true' && '--test' || '' }}
      - name: Сохранить историю доставленных уведомлений
        if: always() && github.event.inputs.test_push != 'true'
        run: |
          if git diff --quiet -- state/grach-films-push.json; then
            echo "Новых отправок нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/grach-films-push.json
          git commit -m "Grach Films: record delivered notifications"
          git pull --rebase origin main
          git push origin HEAD:main
